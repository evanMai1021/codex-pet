name: Publish creator skill download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins/codex-pet/skills/create-codex-pet/**
      - scripts/package_creator_skill.py
      - .github/workflows/package-creator-skill.yml
permissions:
  contents: write
concurrency:
  group: creator-skill-download
  cancel-in-progress: false
jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            plugins/codex-pet/skills/create-codex-pet
            scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build self-contained skill and checksum
        run: python -B scripts/package_creator_skill.py --out skill-download
      - name: Attach to existing mutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.1.15 --json isDraft > "$RUNNER_TEMP/creator-release.json"
          jq -e '.isDraft == false' "$RUNNER_TEMP/creator-release.json" >/dev/null
          gh api "repos/$GH_REPO/releases/tags/v0.1.15" --jq '.immutable == false' | grep -Fx true
          gh release upload v0.1.15 skill-download/create-codex-pet-skill.zip skill-download/create-codex-pet-skill.SHA256.txt --clobber
