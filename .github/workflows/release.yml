name: Publish Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate tag and install locked build dependencies
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            git fetch origin "refs/tags/v${version}:refs/tags/v${version}"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git checkout --detach "v$version"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check logic and both outfit manifests
        env:
          INORI_INTEGRATION_TEST_DIR: ${{ github.workspace }}/.release-tests
        run: |
          node --test --test-isolation=none tests/*.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/validate_builtin_assets.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare pinned standalone runtime and build portable package
        run: |
          python -B scripts/prepare_release_runtime.py --archive .release-cache/runtime-source.zip --out .release-cache/python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/build_portable.py --python-runtime .release-cache/python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create source download and checksum manifest
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          git archive --format=zip --prefix="codex-pet-$version/" --output="dist/codex-pet-source-v$version.zip" HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = Get-ChildItem dist -Filter *.zip | Sort-Object Name | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name }
          $lines | Set-Content -Encoding ascii "dist/SHA256SUMS-v$version.txt"
      - name: Upload downloads and publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip','.txt' } | ForEach-Object FullName)
          gh release create "v$version" @files --draft --verify-tag --title "Codex Pet $version · 楪祈" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
