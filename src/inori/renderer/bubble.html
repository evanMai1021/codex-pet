<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><link rel="stylesheet" href="bubble.css"><title>楪祈 · 任务气泡</title></head>
<body><main aria-label="楪祈任务与用量">
 <svg class="thought-outline" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M52 14 C36 3 14 14 16 34 C1 40 0 61 10 73 C-1 85 1 107 11 116 C0 132 1 152 12 163 C0 179 3 201 16 210 C5 229 17 249 34 249 C31 269 52 282 69 274 C82 291 105 291 118 280 C134 296 157 293 169 280 C186 293 210 287 216 272 C239 282 260 269 260 251 C282 252 296 233 285 214 C299 203 298 181 287 169 C300 155 298 134 288 123 C300 107 298 87 287 76 C300 59 289 38 272 36 C273 15 250 5 233 17 C219 1 197 3 184 16 C169 1 148 4 135 16 C119 2 98 5 87 17 C74 5 61 6 52 14 Z"/></svg>
 <div class="thought-tail" aria-hidden="true"><i></i><i></i></div>
 <header class="meta"><strong id="label"></strong><span id="count"></span><button id="dismiss" class="icon" title="关闭气泡、常驻及自动显示" aria-label="关闭气泡、常驻及自动显示">×</button></header>
 <div class="pages">
  <section id="page-task" role="tabpanel" aria-label="任务">
   <button id="headline" title="点击换一句" aria-label="点击更换气泡短句"></button>
   <section class="task"><h1 id="title"></h1><div id="stage" hidden></div><p id="progress"></p></section>
   <p id="action" hidden></p><small id="note" hidden>审批状态来自试验性桌面接口</small>
   <div class="chat-usage-disclosure" data-expanded="false"><section class="chat-usage" id="chat-usage-details" hidden><label for="thread">会话累计用量</label><select id="thread" aria-label="选择会话用量"></select><div class="number" id="chat-million">正在统计…</div><div class="muted" id="chat-total"></div><small id="chat-health"></small></section></div>
  </section>
  <section id="page-quota" role="tabpanel" aria-label="剩余额度" hidden><div class="quota-heading"><strong>剩余额度</strong></div><div id="quota-summary" role="group" aria-label="剩余额度摘要"></div><div id="quota-details"><div id="quota-windows"></div></div><p id="quota-health" role="status"></p><small id="account"></small><button id="confirm" hidden>确认使用此账户</button><button id="refresh" class="secondary">刷新用量</button></section>
  <section id="page-usage" role="tabpanel" aria-label="今日Token" hidden><div class="section-title">今日 Token</div><div class="number" id="today-million">正在统计…</div><div class="muted" id="today-total"></div><div id="breakdown"></div><small id="usage-date"></small></section>
 </div>
 <div class="usage-actions" id="chat-usage-actions"><button id="chat-usage-toggle" type="button" aria-expanded="false" aria-controls="chat-usage-details"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 12V8m5 4V4m5 8V1M1 15h14"/></svg><span id="chat-usage-toggle-label">会话用量</span></button></div>
 <nav aria-label="气泡翻页"><button id="previous" class="icon" aria-label="上一页">‹</button><div role="tablist" aria-label="内容页面"><button role="tab" data-page="task" aria-controls="page-task">任务</button><button role="tab" data-page="quota" aria-controls="page-quota">额度</button><button role="tab" data-page="usage" aria-controls="page-usage">今日 Token</button></div><button id="next" class="icon" aria-label="下一页">›</button></nav>
</main><script src="quota-view.js"></script><script src="bubble.js"></script></body></html>
